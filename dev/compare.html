<!DOCTYPE html><html><head><meta charset="utf-8"><title>compare</title>
<!-- Dev tool: Figma reference | our render | difference. Open /dev/compare.html?k=<template key>[&crop=x,y,w,h].
     Needs dev/ref/<key>.png (the Figma frame exported at 1x). -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#111;color:#ccc;font:12px sans-serif}canvas{width:33.33vw;display:block;float:left}</style></head>
<body><canvas id="a"></canvas><canvas id="b"></canvas><canvas id="c"></canvas><div id="o" style="clear:both"></div>
<script src="../js/templates.js"></script>
<script src="../js/templates-rankings.js"></script>
<script src="../js/templates-portrait.js"></script>
<script src="../js/templates-square.js"></script>
<script src="../js/templates-arc.js"></script>
<script>
const P=window.PostTemplates, q=new URLSearchParams(location.search), key=q.get('k')||'top1';
const S=P.sizeOf(key), Wd=S.w, Hd=S.h;
const crop=(q.get('crop')||`0,0,${Wd},${Hd}`).split(',').map(Number);
const imgs=new Map();
function load(src){let r=imgs.get(src);if(!r){const i=new Image();r={i,ok:false};r.p=new Promise(res=>{i.onload=()=>{r.ok=true;res()};i.onerror=res});i.src=src.startsWith('assets')?'../'+src:src;imgs.set(src,r)}return r}
const get=s=>{const r=load(s);return r.ok?r.i:null};
(async()=>{
  await Promise.all(['300 20px','400 22px','500 72px','600 40px','700 220px'].map(f=>document.fonts.load(f+' Geist')));
  const d=q.get('data')?JSON.parse(q.get('data')):P.SAMPLE[key]; const srcs=[...P.STATIC_ASSETS]; JSON.stringify(d,(k,v)=>{if(k==='logo'&&v)srcs.push(v);return v});
  const ref=load('./ref/'+(q.get('ref')||key)+'.png'); await Promise.all(srcs.map(s=>load(s).p).concat(ref.p));
  const off=document.createElement('canvas');off.width=Wd;off.height=Hd;const ox=off.getContext('2d');
  const w=P.draw(ox,key,d,get);
  const [cx,cy,cw,ch]=crop;
  [a,b,c].forEach(x=>{x.width=cw;x.height=ch});
  const A=a.getContext('2d'),B=b.getContext('2d'),Cc=c.getContext('2d');
  if(ref.ok) A.drawImage(ref.i,cx,cy,cw,ch,0,0,cw,ch); B.drawImage(off,cx,cy,cw,ch,0,0,cw,ch);
  const r0=document.createElement('canvas');r0.width=Wd;r0.height=Hd;const rx=r0.getContext('2d');if(ref.ok) rx.drawImage(ref.i,0,0,Wd,Hd);
  const da=rx.getImageData(0,0,Wd,Hd).data, db=ox.getImageData(0,0,Wd,Hd).data; const out=ox.createImageData(Wd,Hd); let sum=0;
  for(let i=0;i<da.length;i+=4){const dd=(Math.abs(da[i]-db[i])+Math.abs(da[i+1]-db[i+1])+Math.abs(da[i+2]-db[i+2]))/3;sum+=dd;const v=Math.min(255,dd*4);out.data[i]=v;out.data[i+1]=v;out.data[i+2]=v;out.data[i+3]=255}
  const dc=document.createElement('canvas');dc.width=Wd;dc.height=Hd;dc.getContext('2d').putImageData(out,0,0);
  Cc.drawImage(dc,cx,cy,cw,ch,0,0,cw,ch);
  const px=(data,x,y)=>{const i=(y*Wd+x)*4;return [data[i],data[i+1],data[i+2]]};
  // RESULT.mean: mean per-channel difference (about 3-4 is grain only; higher means something is off)
  window.RESULT={key,mean:+(sum/(da.length/4)).toFixed(2),warn:w};
  window.px=(x,y)=>({ref:px(da,x,y),mine:px(db,x,y)});
  // bounds(x0,y0,x1,y1,thr): ink bounding box [l,t,r,b] inside a region, for the reference and for our render
  window.bounds=(x0,y0,x1,y1,thr=60)=>{const f=(data)=>{const bg=px(data,x0,y0);let l=1e9,t=1e9,r=-1,bt=-1;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const p=px(data,x,y);if(Math.abs(p[0]-bg[0])+Math.abs(p[1]-bg[1])+Math.abs(p[2]-bg[2])>thr){if(x<l)l=x;if(x>r)r=x;if(y<t)t=y;if(y>bt)bt=y}}return [l,t,r,bt]};return {ref:f(da),mine:f(db)}};
  o.textContent=JSON.stringify(window.RESULT);
})();
</script></body></html>
